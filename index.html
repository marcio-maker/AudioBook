<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Estudo — Fila Contínua</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f4f6f9; color: #1f2937; line-height: 1.6; font-size: 16px;
    min-height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
    padding-bottom: calc(96px + env(safe-area-inset-bottom));
  }
  .container { width:100%; max-width:640px; margin:0 auto; padding:12px; }

  /* ===== BARRA DE PROGRESSO ===== */
  .progress-bar {
    position: sticky; top: 0; z-index: 50;
    background: rgba(244,246,249,.94); backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 10px 12px 8px;
    border-bottom: 1px solid #e5e7eb;
  }
  .progress-top { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px; }
  .progress-label { font-size:.75rem; font-weight:700; color:#1e3a8a; }
  .progress-count { font-size:.75rem; font-weight:700; color:#6b7280; }
  .progress-track { height:6px; background:#e5e7eb; border-radius:99px; overflow:hidden; }
  .progress-fill { height:100%; width:0%; background:linear-gradient(90deg,#1e3a8a,#3b82f6); border-radius:99px; transition:width .3s; }
  .progress-actions { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .chip {
    font-size:.7rem; font-weight:700; padding:5px 10px; border-radius:99px;
    border:1px solid #d1d5db; background:#fff; color:#374151; cursor:pointer;
    font-family:inherit; min-height:30px;
  }
  .chip.active { background:#1e3a8a; color:#fff; border-color:#1e3a8a; }

  .materia { margin-bottom: 24px; }
  .materia h2 {
    font-size: 1.1rem; font-weight: 800; color: #1e3a8a;
    margin: 0 0 10px 4px; padding-bottom: 6px;
    border-bottom: 2px solid #e5e7eb;
    display: flex; align-items: center; gap: 8px;
  }
  .materia h2 .badge {
    font-size: .7rem; background: #e5e7eb; color: #6b7280;
    padding: 2px 8px; border-radius: 99px; font-weight: 700;
  }
  .materia.hidden { display:none; }

  .bloco {
    background: #fff; border-radius: 14px; padding: 16px 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,.05); margin-bottom: 12px;
    border-left: 4px solid #e5e7eb; transition: border-color .2s, box-shadow .2s;
  }
  .bloco.ouvido { border-left-color: #16a34a; }
  .bloco.tocando { border-left-color: #1e3a8a; box-shadow: 0 4px 16px rgba(30,58,138,.18); }
  .bloco.hidden { display:none; }

  .bloco .titulo {
    font-size: .78rem; font-weight: 700; color: #1e3a8a;
    text-transform: uppercase; letter-spacing: .4px; margin-bottom: 6px;
  }
  .bloco h3 { font-size: 1.05rem; font-weight: 700; margin-bottom: 10px; color: #111827; }
  .bloco .texto { font-size: .95rem; color: #374151; }
  .bloco .texto p { margin-bottom: 10px; }
  .bloco .texto p:last-child { margin-bottom: 0; }

  .bloco .actions { margin-top: 14px; display:flex; gap:8px; }
  .btn-ouvir {
    flex:1; min-height: 48px; border: none; border-radius: 10px;
    font-size: .95rem; font-weight: 700; font-family: inherit; cursor: pointer;
    background: #1e3a8a; color: #fff;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn-ouvir:active { background: #1e40af; }
  .btn-ouvir.tocando { background: #dc2626; }
  .btn-ouvir.tocando:active { background: #b91c1c; }
  .btn-fila {
    min-height:48px; padding:0 14px; border:none; border-radius:10px;
    background:#e5e7eb; color:#374151; font-weight:700; font-family:inherit;
    cursor:pointer; font-size:.85rem;
  }
  .btn-fila:active { background:#d1d5db; }

  /* ===== MINI-PLAYER ===== */
  .mini-player {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 100;
    background: rgba(15,23,42,.97);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    color: #fff;
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
    box-shadow: 0 -4px 20px rgba(0,0,0,.35);
    transform: translateY(120%);
    transition: transform .3s ease;
  }
  .mini-player.visible { transform: translateY(0); }

  .mini-info {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; margin-bottom: 8px;
  }
  .mini-title {
    font-size: .78rem; font-weight: 700; color: #dbeafe;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    flex: 1;
  }
  .mini-rate {
    font-size: .7rem; font-weight: 800; background: rgba(255,255,255,.18);
    padding: 4px 10px; border-radius: 99px; cursor: pointer; border: none;
    color: #fff; font-family: inherit; min-height:30px;
  }
  .mini-controls {
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .mini-btn {
    background: rgba(255,255,255,.14); border: none; color: #fff;
    border-radius: 50%; width: 46px; height: 46px; font-size: 1.15rem;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-family: inherit;
    transition: background .15s;
  }
  .mini-btn:active { background: rgba(255,255,255,.3); }
  .mini-btn.play { width: 54px; height: 54px; font-size: 1.35rem; background:#fff; color:#0f172a; }
  .mini-btn.play:active { background:#dbeafe; }
  .mini-btn.stop { background: rgba(220,38,38,.75); }
  .mini-btn.stop:active { background:#b91c1c; }

  .toast {
    position: fixed; left: 50%; transform: translateX(-50%) translateY(120%);
    bottom: calc(120px + env(safe-area-inset-bottom));
    background: #111827; color: #fff; font-size: .8rem; font-weight: 600;
    padding: 10px 16px; border-radius: 99px; z-index: 200;
    transition: transform .3s; max-width: 90%; text-align: center;
  }
  .toast.visible { transform: translateX(-50%) translateY(0); }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.5);
    z-index: 300; display: none; align-items: center; justify-content: center;
    padding: 20px;
  }
  .modal-overlay.visible { display: flex; }
  .modal {
    background: #fff; border-radius: 16px; padding: 20px;
    max-width: 360px; width: 100%;
  }
  .modal h3 { font-size: 1.05rem; margin-bottom: 8px; color: #111827; }
  .modal p { font-size: .9rem; color: #4b5563; margin-bottom: 16px; }
  .modal-actions { display: flex; gap: 8px; }
  .modal-actions button {
    flex: 1; min-height: 44px; border: none; border-radius: 10px;
    font-weight: 700; font-family: inherit; cursor: pointer; font-size: .9rem;
  }
  .modal-actions .primary { background: #1e3a8a; color: #fff; }
  .modal-actions .secondary { background: #e5e7eb; color: #374151; }

  @media (min-width:600px) {
    body { font-size: 17px; }
    .container { padding: 20px; }
    .bloco { padding: 22px 20px; }
    .bloco h3 { font-size: 1.15rem; }
    .bloco .texto { font-size: 1rem; }
  }
  button { font-size: 16px; }
</style>
</head>
<body>

<!-- ===== BARRA DE PROGRESSO ===== -->
<div class="progress-bar" id="progressBar">
  <div class="progress-top">
    <span class="progress-label">📚 Progresso</span>
    <span class="progress-count" id="progressCount">0/102</span>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-actions">
    <button class="chip" id="btnFiltro">👁 Só não ouvidos</button>
    <button class="chip" id="btnPrimeiro">▶ Começar do primeiro não ouvido</button>
  </div>
</div>

<div class="container">
  <div id="materias"></div>
</div>

<!-- ===== MINI-PLAYER (estilo YouTube) ===== -->
<div class="mini-player" id="miniPlayer">
  <div class="mini-info">
    <div class="mini-title" id="miniTitle">—</div>
    <button class="mini-rate" id="miniRate">1.0×</button>
  </div>
  <div class="mini-controls">
    <button class="mini-btn" id="btnPrev" title="Anterior">⏮</button>
    <button class="mini-btn play" id="btnPlayPause" title="Play/Pause">⏸</button>
    <button class="mini-btn" id="btnNext" title="Próximo">⏭</button>
    <button class="mini-btn stop" id="btnStop" title="Parar">⏹</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- ===== MODAL RETOMAR ===== -->
<div class="modal-overlay" id="modalRetomar">
  <div class="modal">
    <h3>Retomar estudo?</h3>
    <p id="modalTexto">Você parou em um bloco. Deseja continuar de onde parou?</p>
    <div class="modal-actions">
      <button class="secondary" id="btnRecomecar">Recomeçar</button>
      <button class="primary" id="btnContinuar">Continuar</button>
    </div>
  </div>
</div>

<script>
/* =====================================================
   CONTEÚDO — 6 Matérias + Extras = 102 Blocos
   ===================================================== */
const MATERIAS = [
  /* ============================================================
     👥 RH — 25 BLOCOS
     ============================================================ */
  {
    nome: "RH",
    icone: "👥",
    blocos: [
      { titulo:"Bloco 1", heading:"O que é gestão de pessoas", texto:[
        "Gestão de pessoas é a área da organização responsável por tudo que envolve o ser humano no trabalho. Isso inclui atrair, desenvolver, motivar e manter as pessoas dentro da empresa.",
        "Durante muito tempo, essa área foi vista apenas como operacional. Cuidava de folha de pagamento, ponto, férias e documentação. Era o setor que resolvia papelada.",
        "Hoje, o cenário mudou. A gestão de pessoas passou a ser estratégica. Ela participa das decisões importantes da organização. Ajuda a definir rumos, preparar equipes e garantir que a empresa tenha as pessoas certas nos lugares certos.",
        "Existe uma diferença importante entre gestão de pessoas e gestão de recursos humanos. Gestão de recursos humanos é o nome mais antigo, ligado à ideia de que pessoas são recursos, como máquinas ou dinheiro. Gestão de pessoas é o nome mais moderno, que enxerga o ser humano como parceiro da organização, e não como simples recurso.",
        "Essa mudança de nome reflete uma mudança de mentalidade. Antes, a pessoa era vista como custo. Agora, é vista como diferencial competitivo.",
        "Então, guarde bem essa ideia. Gestão de pessoas é a área que cuida do ser humano no trabalho. E quando ela é estratégica, deixa de apenas resolver problemas e passa a construir resultados."
      ].join("\n\n") },
      { titulo:"Bloco 2", heading:"Gestão estratégica de pessoas", texto:[
        "A gestão estratégica de pessoas é quando a área de recursos humanos deixa de agir só no operacional e passa a participar do planejamento da organização.",
        "Na prática, significa alinhar as políticas de pessoas aos objetivos do negócio. Se a empresa quer crescer, o setor de pessoas precisa preparar a equipe para esse crescimento. Se a empresa quer inovar, precisa contratar e desenvolver pessoas com esse perfil.",
        "Uma gestão estratégica de pessoas trabalha em quatro frentes principais. Primeiro, atrai talentos. Segundo, desenvolve esses talentos. Terceiro, mantém as pessoas boas na empresa. Quarto, garante que tudo isso esteja ligado à estratégia.",
        "Existe uma diferença clara entre o modelo tradicional e o estratégico. No modelo tradicional, o setor de pessoal só executa. Paga, registra, controla. No modelo estratégico, o setor de pessoal participa das decisões. Antecipa necessidades. Propõe soluções.",
        "Um exemplo ajuda a entender. Imagine uma empresa que decidiu abrir uma filial em outra cidade. No modelo tradicional, o setor de pessoal só vai agir quando a filial já estiver montada, contratando quem aparecer. No modelo estratégico, o setor de pessoal participa desde o começo. Planeja quantas pessoas serão necessárias, que perfis, que treinamento, em que prazo.",
        "Guarde isto: gestão estratégica de pessoas é alinhar gente e negócio. Não é só contratar e pagar. É pensar no presente e no futuro da organização."
      ].join("\n\n") },
      { titulo:"Bloco 3", heading:"Recrutamento", texto:[
        "Recrutamento é o processo de atrair candidatos para uma vaga. É a etapa em que a empresa vai ao mercado buscar pessoas com potencial para ocupar determinada função.",
        "Recrutamento não é a mesma coisa que seleção. Muita gente confunde. Recrutamento atrai. Seleção escolhe. São duas etapas diferentes, uma depois da outra.",
        "Existem dois tipos principais de recrutamento. O recrutamento interno e o recrutamento externo.",
        "O recrutamento interno busca candidatos dentro da própria empresa. Pode ser por promoção, transferência ou remanejamento. Tem vantagens. Motiva quem já trabalha ali, aproveita quem já conhece a cultura, custa menos e é mais rápido. Tem também desvantagens. Pode gerar acomodação, porque as pessoas sabem que a vaga vai ser preenchida por alguém de dentro. E fecha a porta para ideias novas de fora.",
        "O recrutamento externo busca candidatos no mercado. Anúncios, redes sociais, indicações, sites de emprego, agências. Tem vantagens. Traz sangue novo, novas ideias, novas experiências. Tem desvantagens. Custa mais, demora mais, e a pessoa precisa de tempo para se adaptar à cultura da empresa.",
        "Existe ainda o recrutamento misto, que combina os dois. É o mais comum nas organizações bem estruturadas. Primeiro, olham para dentro. Se não encontram, vão para fora.",
        "Guarde isto: recrutamento é atrair. E a escolha entre interno e externo depende do momento da empresa e do tipo de vaga."
      ].join("\n\n") },
      { titulo:"Bloco 4", heading:"Seleção de pessoas", texto:[
        "Seleção é o processo de escolher, entre os candidatos recrutados, aquele que tem mais chance de dar certo na vaga.",
        "Se o recrutamento atrai, a seleção filtra. Ela compara o perfil de cada candidato com o que a vaga exige. E escolhe o mais adequado.",
        "Existem várias técnicas de seleção. As principais são a entrevista, as provas de conhecimento, os testes psicológicos, as dinâmicas de grupo e a análise curricular.",
        "A entrevista é a técnica mais usada. Pode ser individual ou em grupo. Pode ser estruturada, com perguntas fixas, ou livre, com conversa aberta. A estruturada é mais justa, porque compara todos os candidatos com os mesmos critérios.",
        "As provas de conhecimento medem o quanto o candidato domina determinado assunto ou técnica. Podem ser escritas, práticas ou orais.",
        "Os testes psicológicos avaliam características pessoais, como raciocínio, personalidade e comportamento. Devem ser aplicados por psicólogos.",
        "As dinâmicas de grupo observam como o candidato se comporta em situações coletivas. Mostram liderança, comunicação, capacidade de trabalhar em equipe.",
        "A análise curricular é a leitura do histórico do candidato. Formação, experiências anteriores, cursos. Serve como triagem inicial, mas não decide sozinha.",
        "Um bom processo de seleção combina várias técnicas. Nenhuma técnica sozinha é suficiente. E existe um princípio que vale sempre: quanto mais claros os critérios da vaga, melhor a seleção.",
        "Guarde isto: recrutamento atrai, seleção escolhe. E quanto melhor a seleção, menor a rotatividade de pessoal depois."
      ].join("\n\n") },
      { titulo:"Bloco 5", heading:"Treinamento e desenvolvimento", texto:[
        "Treinamento é o processo de preparar a pessoa para executar melhor o trabalho que ela já faz. Desenvolvimento é o processo de preparar a pessoa para funções futuras, mais amplas.",
        "A diferença é o foco no tempo. Treinamento olha para o presente. Desenvolvimento olha para o futuro. Treinamento ensina o que a pessoa precisa saber agora. Desenvolvimento prepara para o que ela pode vir a fazer depois.",
        "Existe uma sigla muito cobrada em prova que resume o que o treinamento trabalha. É o C H A. Conhecimento, habilidade e atitude.",
        "Conhecimento é o saber. É a informação que a pessoa tem sobre o trabalho. Habilidade é o saber fazer. É a prática, a técnica. Atitude é o querer fazer. É a disposição, o comportamento.",
        "Um treinamento completo trabalha os três. Não adianta ensinar a técnica se a pessoa não quer aplicar. Não adianta querer que a pessoa faça se ela não sabe como.",
        "O treinamento costuma seguir quatro etapas. Primeiro, o levantamento de necessidades. Segundo, o planejamento. Terceiro, a execução. Quarto, a avaliação.",
        "O levantamento de necessidades identifica o que está faltando. Pode ser feito ouvindo chefes, analisando erros, observando o desempenho.",
        "O planejamento define o que será ensinado, para quem, como, quando e onde.",
        "A execução é o treinamento acontecendo. Pode ser presencial, à distância, no próprio trabalho ou fora dele.",
        "A avaliação mede se o treinamento funcionou. Compara o desempenho antes e depois. Se o resultado não mudou, o treinamento precisa ser revisto.",
        "Guarde isto: treinamento trabalha conhecimento, habilidade e atitude. E só termina quando o desempenho melhora de verdade."
      ].join("\n\n") },
      { titulo:"Bloco 6", heading:"Avaliação de desempenho", texto:[
        "Avaliação de desempenho é o processo de medir como cada pessoa está executando o seu trabalho.",
        "Serve para várias coisas. Identificar quem está indo bem. Identificar quem precisa de apoio. Decidir promoções. Definir treinamentos. Corrigir rumos.",
        "Existem vários métodos de avaliação. Os mais cobrados em prova são a escala gráfica, a escolha forçada, a pesquisa de campo, os incidentes críticos e a avaliação por objetivos.",
        "A escala gráfica avalia o desempenho por fatores, como produtividade, qualidade e assiduidade. Cada fator recebe uma nota. É simples, mas pode ser superficial.",
        "A escolha forçada apresenta pares de frases e obriga o avaliador a escolher uma. Reduz a subjetividade, mas é cansativa para quem avalia.",
        "A pesquisa de campo envolve o setor de pessoal entrevistando o chefe e o avaliado. É mais profunda, mas consome tempo.",
        "Os incidentes críticos registram comportamentos positivos e negativos ao longo do período. É rica em detalhe, mas exige disciplina para anotar.",
        "A avaliação por objetivos compara o que foi combinado com o que foi entregue. É muito usada em cargos de gestão.",
        "Independente do método, alguns princípios valem sempre. Os critérios precisam ser claros. Precisam ser combinados antes. Precisam estar ligados às responsabilidades da função. E a avaliação precisa gerar retorno para a pessoa avaliada.",
        "Guarde isto: avaliação de desempenho sem critério claro vira julgamento pessoal. E julgamento pessoal não melhora ninguém."
      ].join("\n\n") },
      { titulo:"Bloco 7", heading:"Motivação no trabalho", texto:[
        "Motivação é o conjunto de forças que impulsiona a pessoa a agir de determinada maneira.",
        "No trabalho, a motivação não é igual para todo mundo. Cada pessoa tem necessidades diferentes. O que motiva uma pode não motivar outra.",
        "Existem várias teorias sobre motivação. As mais cobradas são a hierarquia das necessidades, de Maslow, e a teoria dos dois fatores, de Herzberg.",
        "Maslow organizou as necessidades humanas em cinco níveis. Na base, as necessidades fisiológicas, como fome e sono. Depois, segurança. Depois, as necessidades sociais, de pertencimento. Depois, estima, reconhecimento. No topo, autorrealização.",
        "A ideia de Maslow é que a pessoa busca primeiro o que está na base. Só depois de satisfazer um nível ela passa para o próximo.",
        "Herzberg dividiu os fatores que influenciam o trabalho em dois grupos. Os fatores higiênicos e os fatores motivacionais.",
        "Fatores higiênicos são aqueles ligados ao ambiente. Salário, condições de trabalho, políticas da empresa, relação com colegas e chefes. Quando esses fatores estão ruins, eles causam insatisfação. Quando estão bons, apenas evitam a insatisfação. Não motivam por si sós.",
        "Fatores motivacionais são aqueles ligados ao conteúdo do trabalho. Reconhecimento, responsabilidade, crescimento, realização. Esses sim motivam de verdade.",
        "É por isso que só aumentar salário não resolve tudo. Salário é fator higiênico. Se estiver ruim, atrapalha. Mas se estiver bom, não garante que a pessoa esteja motivada.",
        "Guarde isto: motivação é multifatorial. Envolve o indivíduo, o ambiente e o conteúdo do trabalho. E nenhuma empresa motiva ninguém. Ela cria condições para que a pessoa se motive."
      ].join("\n\n") },
      { titulo:"Bloco 8", heading:"Liderança", texto:[
        "Liderança é a capacidade de influenciar pessoas para alcançar objetivos.",
        "Liderança não é a mesma coisa que chefia. Chefia vem do cargo. Liderança vem do comportamento. Você pode ser chefe sem ser líder, e líder sem ser chefe.",
        "Existem várias teorias sobre liderança. As principais são a teoria dos traços, a teoria comportamental e a teoria situacional.",
        "A teoria dos traços tentou identificar características inatas do líder. Carisma, coragem, inteligência. Essa teoria caiu por terra, porque não existe um conjunto fixo de traços que garanta liderança.",
        "A teoria comportamental olhou para o que o líder faz, não para o que ele é. Identificou dois estilos principais. O líder voltado para a tarefa e o líder voltado para as pessoas. O primeiro foca no resultado. O segundo foca no relacionamento.",
        "A teoria situacional diz que não existe um estilo único de liderança. O bom líder ajusta o estilo à situação e à maturidade da equipe. Com uma equipe nova, ele dirige mais. Com uma equipe experiente, ele delega mais.",
        "Existe uma ideia muito importante nessa teoria. Liderança eficaz é a que se adapta. Não existe um jeito certo para todos os momentos.",
        "Um líder eficaz faz algumas coisas bem. Comunica com clareza. Ouve. Dá direção. Desenvolve as pessoas. Reconhece o bom trabalho. Corrige sem humilhar.",
        "Guarde isto: liderança é influência, não cargo. E liderança eficaz é a que se ajusta à situação, sem perder o foco nos objetivos e nas pessoas."
      ].join("\n\n") },
      { titulo:"Bloco 9", heading:"Cultura e clima organizacional", texto:[
        "Cultura organizacional e clima organizacional são conceitos diferentes, mas os dois falam sobre o ambiente interno da empresa.",
        "Cultura organizacional é o conjunto de valores, crenças, hábitos e normas compartilhados pelas pessoas da organização. É a identidade da empresa. Aquilo que ela é.",
        "A cultura é construída aos poucos. Vem dos fundadores, das histórias, dos rituais, dos símbolos, das decisões repetidas. E é difícil de mudar, porque está enraizada.",
        "A cultura aparece em coisas visíveis, como a forma de vestir, a linguagem usada, o layout do escritório. E aparece em coisas invisíveis, como o que é valorizado, o que é punido, o que é considerado certo.",
        "Clima organizacional é a percepção momentânea que as pessoas têm do ambiente de trabalho. É como elas se sentem ali naquele período. Satisfeitas, tensas, animadas, desmotivadas.",
        "A diferença principal é o tempo. Cultura é profunda e duradoura. Clima é superficial e mutável. Uma semana ruim pode piorar o clima. Mas a cultura continua a mesma.",
        "O clima é medido por pesquisas periódicas. A cultura é estudada por observação e análise profunda.",
        "Existe uma relação entre os dois. Uma cultura saudável tende a gerar bom clima. Mas clima bom num mês não significa cultura boa. E vice-versa.",
        "Guarde isto: cultura é o que a empresa é. Clima é como as pessoas estão se sentindo agora. São coisas diferentes, mas se influenciam."
      ].join("\n\n") },
      { titulo:"Bloco 10", heading:"Negociação", texto:[
        "Negociação é o processo de buscar um acordo entre duas ou mais partes que têm interesses diferentes.",
        "No trabalho do administrador de recursos humanos, a negociação aparece o tempo todo. Negociar salário com candidato. Negociar prazo com chefia. Negociar conflito entre colegas. Negociar acordo coletivo com sindicato.",
        "Existem dois tipos principais de negociação. A negociação distributiva e a negociação integrativa.",
        "A negociação distributiva é aquela em que o ganho de uma parte significa a perda da outra. É o jogo de soma zero. Um ganha, o outro perde. Também é chamada de negociação ganha-perde.",
        "A negociação integrativa busca soluções em que as duas partes ganham. É o jogo de soma positiva. Também chamada de ganha-ganha.",
        "A negociação ganha-ganha é mais difícil de conseguir, mas costuma gerar acordos melhores e mais duradouros. Porque as duas partes saem satisfeitas e cumprem o que foi combinado.",
        "Existe uma ideia essencial em negociação. Não se negocia posição, negocia-se interesse. Posição é o que a pessoa diz que quer. Interesse é o motivo por trás. Duas pessoas podem ter posições opostas e interesses compatíveis.",
        "Um bom negociador faz algumas coisas. Prepara-se antes. Ouve mais do que fala. Identifica os interesses por trás das posições. Busca alternativas. Não decide no calor da emoção.",
        "Guarde isto: negociar bem não é ganhar do outro. É chegar a um acordo que funcione para os dois lados e que se sustente no tempo."
      ].join("\n\n") },
      { titulo:"Bloco 11", heading:"Cargos, salários e remuneração", texto:[
        "Cargos, salários e remuneração formam um conjunto de práticas que organiza como as pessoas são pagas na empresa.",
        "Cargo é o conjunto de funções com responsabilidades parecidas. Cada cargo tem um nome, uma descrição e requisitos.",
        "Descrição de cargo é o documento que diz o que o ocupante faz. Tarefas, responsabilidades, condições de trabalho.",
        "Análise de cargo é o estudo que se faz para chegar a essa descrição. É a pesquisa que vem antes.",
        "Salário é a contraprestação paga pelo empregador ao empregado em razão do trabalho. Pode ser fixo, variável ou misto.",
        "Remuneração é o conjunto de tudo que o empregado recebe pelo trabalho. Inclui o salário e também outros valores, como comissões, gratificações, adicionais e benefícios.",
        "Existe uma diferença entre salário e remuneração. Salário é a parte fixa. Remuneração é o todo.",
        "Benefícios são vantagens oferecidas além do salário. Vale-transporte, vale-refeição, plano de saúde, seguro de vida. Alguns são obrigatórios por lei. Outros são oferecidos por escolha da empresa.",
        "Política salarial é o conjunto de regras que a empresa usa para decidir quanto pagar. Envolve pesquisas de mercado, definição de faixas e critérios de progressão.",
        "Existem também as chamadas obrigações legais. O décimo terceiro salário. As férias remuneradas. O fundo de garantia. Os adicionais de insalubridade e periculosidade. As horas extras. Tudo isso é tratado pela administração de pessoal.",
        "Guarde isto: salário é a parte fixa. Remuneração é o conjunto. E uma boa política salarial equilibra o que a empresa pode pagar com o que o mercado oferece."
      ].join("\n\n") },
      { titulo:"Bloco 12", heading:"Saúde e segurança no trabalho", texto:[
        "Saúde e segurança no trabalho é o conjunto de ações que protegem a integridade física e mental do trabalhador.",
        "Essas ações não são opcionais. São obrigações legais do empregador. E são também um investimento, porque ambientes saudáveis produzem mais e geram menos afastamentos.",
        "Existem vários riscos no ambiente de trabalho. Riscos físicos, como ruído, calor, vibração e radiação. Riscos químicos, como poeira, gases e produtos tóxicos. Riscos biológicos, como vírus, bactérias e fungos. Riscos ergonômicos, como postura inadequada e movimentos repetitivos. E riscos de acidente, como máquinas sem proteção e trabalhos em altura.",
        "Existem dois adicionais ligados a esses riscos. O adicional de insalubridade e o adicional de periculosidade.",
        "Insalubridade está ligada a risco à saúde. O trabalhador fica exposto a agentes que podem adoecê-lo. Ruído alto, calor excessivo, produtos químicos, agentes biológicos.",
        "Periculosidade está ligada a risco à vida ou à integridade física. Explosivos, inflamáveis, energia elétrica, segurança pessoal, certas atividades com motocicleta.",
        "A diferença é o tipo de risco. Insalubridade adoece. Periculosidade mata ou fere de repente.",
        "Existem também as normas regulamentadoras. São regras técnicas do Ministério do Trabalho que definem como cada atividade deve ser feita com segurança. Elas são identificadas por números.",
        "Entre as medidas de proteção, existem os equipamentos de proteção individual, chamados de E P I. São aqueles usados pela própria pessoa. Capacete, luva, óculos, protetor auricular. Existem também os equipamentos de proteção coletiva, chamados de E P C. São aqueles que protegem todo mundo no ambiente. Extintor, corrimão, exaustor, sinalização.",
        "Guarde isto: a empresa precisa proteger a saúde e a segurança do trabalhador. E quando o risco não pode ser eliminado, o trabalhador tem direito a adicional."
      ].join("\n\n") },
      { titulo:"Bloco 13", heading:"Administração de pessoal — rotinas", texto:[
        "Administração de pessoal é a parte mais operacional do setor de recursos humanos. Cuida da vida funcional do empregado, do começo ao fim do contrato.",
        "Começa na admissão. Recolher documentos, registrar o contrato, fazer exames admissionais, cadastrar nos sistemas. Cada passo tem prazo e formato exigidos pela lei.",
        "Continua no dia a dia. Controlar frequência e ponto. Calcular folha de pagamento. Processar férias. Lançar afastamentos. Atualizar cadastros.",
        "O ponto é o registro da jornada. Marca entrada, saída, intervalos. Pode ser manual, mecânico ou eletrônico. A jornada normal tem limites legais. O que passa disso vira hora extra.",
        "A folha de pagamento é o documento que calcula tudo que o empregado deve receber e tudo que deve ser descontado. Salário, horas extras, adicionais, faltas, descontos legais. Também calcula os encargos que a empresa paga sobre a mão de obra.",
        "As férias são um direito anual do trabalhador. Precisam ser concedidas dentro de um período determinado. Podem ser divididas em partes, mas dentro dos limites da lei. E são sempre remuneradas com acréscimo.",
        "Os afastamentos legais incluem licenças médicas, licença-maternidade, licença-paternidade, serviço militar, entre outros. Cada um tem regras próprias de duração e de pagamento.",
        "A rescisão é o encerramento do contrato. Pode ocorrer por vários motivos. Pedido de demissão, dispensa sem justa causa, dispensa por justa causa, fim de contrato, aposentadoria. Cada tipo gera verbas diferentes.",
        "O aviso-prévio é a comunicação antecipada de que o contrato será encerrado. Pode ser trabalhado ou indenizado. O prazo varia conforme o tempo de serviço.",
        "Guarde isto: administração de pessoal garante que tudo o que a lei manda seja cumprido, no prazo e na forma corretos. É a base sobre a qual as demais práticas de recursos humanos se sustentam."
      ].join("\n\n") },
      { titulo:"Bloco 14", heading:"Descrição e análise de cargos", texto:[
        "Descrição e análise de cargos são duas etapas que andam juntas. A análise vem primeiro. A descrição vem depois.",
        "Análise de cargo é o estudo que se faz para entender o que o cargo exige. É a pesquisa. Você observa o trabalho, conversa com quem ocupa o cargo, examina documentos, compara com cargos parecidos.",
        "Descrição de cargo é o documento que resulta dessa análise. É o registro escrito do que o cargo faz. Ele costuma ter cinco partes principais.",
        "A primeira é o título do cargo. O nome pelo qual ele é conhecido na empresa.",
        "A segunda é o resumo das atividades. Uma frase ou um parágrafo curto que explica o propósito do cargo.",
        "A terceira são as responsabilidades detalhadas. A lista do que o ocupante faz no dia a dia.",
        "A quarta são os requisitos. Escolaridade, experiência, cursos, habilidades específicas.",
        "A quinta são as condições de trabalho. Se é presencial ou remoto, se há exposição a riscos, se exige viagens.",
        "Existe uma diferença entre descrever e especificar. Descrever é falar do cargo. Especificar é falar da pessoa que vai ocupá-lo. A descrição responde o que se faz. A especificação responde quem pode fazer.",
        "Guarde isto: análise é o estudo. Descrição é o registro. E a descrição de cargo bem feita serve de base para recrutamento, seleção, treinamento e avaliação."
      ].join("\n\n") },
      { titulo:"Bloco 15", heading:"Planejamento de RH", texto:[
        "Planejamento de recursos humanos é o processo de prever as necessidades de pessoas da organização, no presente e no futuro.",
        "Ele responde a três perguntas principais. Quantas pessoas a empresa vai precisar. Com que perfil. E em que momento.",
        "O planejamento de RH costuma seguir quatro etapas.",
        "A primeira é a previsão da demanda. Quanta gente a empresa vai precisar, com base nos planos de crescimento, nas metas e nas mudanças previstas.",
        "A segunda é a análise da oferta interna. Quantas pessoas a empresa já tem, com que competências, e quantas devem sair por aposentadoria, demissão ou outros motivos.",
        "A terceira é a comparação entre demanda e oferta. Aqui aparece o chamado gap. Pode ser falta de pessoas, excesso de pessoas ou descompasso de competências.",
        "A quarta é o plano de ação. O que fazer para fechar o gap. Contratar, treinar, remanejar, demitir, terceirizar.",
        "Existem dois tipos principais de planejamento. O planejamento de curto prazo, ligado ao dia a dia. E o planejamento de longo prazo, ligado à estratégia da organização.",
        "Guarde isto: planejamento de RH é prever necessidade de pessoas. Compara demanda e oferta. E fecha o gap com ações concretas."
      ].join("\n\n") },
      { titulo:"Bloco 16", heading:"Rotatividade e absenteísmo", texto:[
        "Rotatividade e absenteísmo são dois indicadores que mostram como está a relação entre a empresa e as pessoas.",
        "Rotatividade, também chamada de turnover, é a taxa de entrada e saída de pessoas na empresa. Ela mede quantas pessoas saíram e quantas entraram em determinado período.",
        "Uma rotatividade alta custa caro. Gera custo de recrutamento, custo de seleção, custo de treinamento, perda de conhecimento e queda de produtividade. Uma rotatividade saudável existe, porque renova a equipe. Mas rotatividade excessiva é sinal de problema.",
        "Absenteísmo é a ausência do empregado ao trabalho. Pode ser por falta justificada ou não justificada. Ele é medido pela relação entre as horas perdidas e as horas previstas.",
        "O absenteísmo alto costuma ter causas variadas. Problemas de saúde. Problemas de clima. Problemas de liderança. Problemas pessoais. Falta de motivação. Ou combinação disso tudo.",
        "Existe também o chamado absenteísmo por doença, que é quando o empregado se afasta por motivo de saúde. E o absenteísmo voluntário, que é quando o empregado falta sem justificativa.",
        "Guarde isto: rotatividade é a saída de pessoas. Absenteísmo é a ausência ao trabalho. Os dois são indicadores. E os dois pedem investigação de causa antes de qualquer ação."
      ].join("\n\n") },
      { titulo:"Bloco 17", heading:"Qualidade de vida no trabalho", texto:[
        "Qualidade de vida no trabalho é o conjunto de ações que busca tornar o ambiente de trabalho mais saudável, equilibrado e satisfatório para as pessoas.",
        "Ela não é só conforto físico. Ela envolve várias dimensões.",
        "A primeira é a dimensão física. Condições do ambiente. Iluminação, temperatura, ruído, ergonomia, segurança.",
        "A segunda é a dimensão psicológica. Saúde mental, equilíbrio emocional, respeito, reconhecimento.",
        "A terceira é a dimensão social. Relações com colegas e chefes. Senso de pertencimento. Trabalho em equipe.",
        "A quarta é a dimensão profissional. Oportunidade de crescimento, desenvolvimento, autonomia, desafio.",
        "A quinta é a dimensão institucional. Políticas da empresa, estabilidade, transparência, ética.",
        "Existe uma diferença entre qualidade de vida no trabalho e benefícios. Benefícios são vantagens oferecidas. Qualidade de vida é a experiência concreta do trabalhador no dia a dia. Uma empresa pode ter muitos benefícios e uma qualidade de vida ruim.",
        "Programas comuns de qualidade de vida incluem ginástica laboral, apoio psicológico, flexibilidade de horário, pausas programadas, alimentação saudável e ações de prevenção de saúde.",
        "Guarde isto: qualidade de vida no trabalho tem várias dimensões. Física, psicológica, social, profissional e institucional. E ela é uma experiência concreta, não um pacote de benefícios."
      ].join("\n\n") },
      { titulo:"Bloco 18", heading:"Gestão por competências", texto:[
        "Gestão por competências é um modelo que organiza as práticas de recursos humanos em torno das competências necessárias para a organização.",
        "Competência é a combinação de três elementos. Conhecimento, habilidade e atitude. É o famoso C H A. Conhecimento é o saber. Habilidade é o saber fazer. Atitude é o querer fazer.",
        "Existem dois tipos principais de competências.",
        "As competências técnicas, também chamadas de competências hard. São aquelas ligadas ao conhecimento específico da função. Por exemplo, saber usar um sistema, conhecer uma norma, dominar uma técnica.",
        "As competências comportamentais, também chamadas de competências soft. São aquelas ligadas ao comportamento. Comunicação, liderança, trabalho em equipe, resiliência, empatia.",
        "A gestão por competências costuma seguir quatro etapas.",
        "Primeiro, identificar as competências necessárias para a organização e para cada cargo.",
        "Segundo, mapear as competências que as pessoas já têm.",
        "Terceiro, comparar o que existe com o que é necessário. Identificar as lacunas.",
        "Quarto, agir sobre as lacunas. Por meio de treinamento, desenvolvimento, contratação ou remanejamento.",
        "Guarde isto: gestão por competências organiza o RH em torno do que a organização precisa saber fazer. Combina conhecimento, habilidade e atitude. E atua sobre as lacunas identificadas."
      ].join("\n\n") },
      { titulo:"Bloco 19", heading:"Avaliação 360 graus", texto:[
        "Avaliação 360 graus é um método de avaliação de desempenho em que a pessoa é avaliada por todos que convivem com ela no trabalho.",
        "São várias fontes de avaliação. O chefe direto. Os colegas de mesmo nível. Os subordinados. Os clientes internos e externos. E a própria pessoa, que faz uma autoavaliação.",
        "A ideia central é ter uma visão ampla do desempenho. Não só a visão do chefe, mas a de todos que interagem com a pessoa.",
        "As vantagens são várias. Reduz o viés de uma única fonte. Dá retorno mais completo. Estimula a autoconsciência. E melhora a comunicação entre as pessoas.",
        "As desvantagens também existem. É mais complexa de aplicar. Consome tempo. Pode gerar desconforto. E pode virar um jogo de simpatia, se não houver critérios claros.",
        "Existe uma diferença entre avaliação 360 graus e avaliação por objetivos. A 360 graus olha para comportamentos e relações. A por objetivos olha para resultados combinados.",
        "Para funcionar, a avaliação 360 graus precisa de três coisas. Critérios claros. Anonimato das respostas. E retorno estruturado para a pessoa avaliada.",
        "Guarde isto: avaliação 360 graus ouve várias fontes. Chefe, colegas, subordinados, clientes e a própria pessoa. Dá visão ampla, mas exige critério e cuidado."
      ].join("\n\n") },
      { titulo:"Bloco 20", heading:"Feedback e conversa difícil", texto:[
        "Feedback é o retorno que se dá a alguém sobre o seu desempenho ou comportamento. É uma ferramenta central na gestão de pessoas.",
        "Existem dois tipos principais. O feedback positivo, que reconhece o que está bom. E o feedback construtivo, que aponta o que precisa melhorar.",
        "O feedback positivo é importante porque reforça comportamentos desejados. Muita gente esquece de dar. Mas ele motiva, orienta e fortalece a relação.",
        "O feedback construtivo é mais difícil. Ele precisa ser específico, focado no comportamento e não na pessoa. Dizer você é desorganizado ataca a pessoa. Dizer os relatórios chegaram com atraso nas últimas três semanas aponta o comportamento.",
        "Existe um modelo simples para estruturar o feedback construtivo. Ele tem quatro passos.",
        "Primeiro, descreva a situação. O que aconteceu, quando e onde.",
        "Segundo, descreva o comportamento observado. Sem julgamento, sem adjetivo.",
        "Terceiro, descreva o impacto. O que aquele comportamento causou.",
        "Quarto, proponha ou peça uma ação. O que pode ser feito diferente.",
        "Uma conversa difícil exige preparo. Escolha o momento certo. Escolha o lugar certo. Escute antes de falar. Não decida no calor da emoção. E foque no futuro, não no passado.",
        "Guarde isto: feedback é retorno. Pode ser positivo ou construtivo. O construtivo foca no comportamento, não na pessoa. E conversa difícil exige preparo."
      ].join("\n\n") },
      { titulo:"Bloco 21", heading:"Conflitos e mediação", texto:[
        "Conflito é a situação em que duas ou mais partes percebem seus interesses como incompatíveis.",
        "Existe uma ideia errada de que todo conflito é ruim. Não é. O conflito faz parte da vida em grupo. Em doses saudáveis, ele estimula discussão, criatividade e mudança. O problema é o conflito mal administrado.",
        "Existem vários tipos de conflito. Conflito de relacionamento, ligado a diferenças pessoais. Conflito de tarefa, ligado ao conteúdo do trabalho. Conflito de processo, ligado a como o trabalho é feito. E conflito de valores, ligado a crenças e princípios.",
        "Existem também várias formas de lidar com conflito.",
        "A primeira é evitar. Você foge da situação. Funciona quando o problema é pequeno, mas piora quando o problema é grande.",
        "A segunda é competir. Você impõe o seu ponto. Funciona em emergências, mas desgasta a relação.",
        "A terceira é ceder. Você abre mão do seu ponto. Funciona quando a relação importa mais que o resultado, mas gera ressentimento se for sempre.",
        "A quarta é negociar. As duas partes cedem um pouco. Funciona quando há tempo e disposição.",
        "A quinta é colaborar. As duas partes buscam uma solução que atenda aos interesses de ambas. É a mais difícil, mas a que gera melhores resultados.",
        "Mediação é quando uma terceira pessoa ajuda as partes a chegar a um acordo. O mediador não decide. Ele facilita a conversa.",
        "Guarde isto: conflito não é sempre ruim. Existem formas de lidar. E a colaboração, quando possível, é a que gera melhores resultados."
      ].join("\n\n") },
      { titulo:"Bloco 22", heading:"Trabalho em equipe", texto:[
        "Trabalho em equipe é quando um grupo de pessoas atua de forma coordenada, com objetivos comuns e responsabilidade compartilhada.",
        "Existe uma diferença entre grupo e equipe. Grupo é um conjunto de pessoas que trabalham perto. Equipe é um conjunto de pessoas que trabalham juntas, com interdependência e objetivo comum.",
        "As equipes costumam passar por cinco estágios de desenvolvimento.",
        "O primeiro é a formação. As pessoas se conhecem, ainda com formalidade.",
        "O segundo é a turbulência. Aparecem conflitos, diferenças, disputas de espaço.",
        "O terceiro é a normatização. O grupo cria regras, ajusta expectativas, encontra um jeito de trabalhar.",
        "O quarto é o desempenho. A equipe produz de forma madura e coordenada.",
        "O quinto é o encerramento. A equipe se desfaz, cumprido o objetivo.",
        "Existem também os papéis dentro da equipe. Tem quem lidera. Tem quem organiza. Tem quem questiona. Tem quem executa. Tem quem cuida do clima. Equipes maduras respeitam esses papéis.",
        "Uma equipe eficaz tem algumas características. Objetivos claros. Comunicação aberta. Confiança entre os membros. Responsabilidade compartilhada. E reconhecimento do trabalho coletivo.",
        "Guarde isto: grupo não é equipe. Equipe tem interdependência e objetivo comum. E equipes passam por estágios até amadurecer."
      ].join("\n\n") },
      { titulo:"Bloco 23", heading:"Comunicação organizacional", texto:[
        "Comunicação organizacional é o conjunto de trocas de informação dentro da organização.",
        "Ela pode ser classificada de várias formas.",
        "Quanto ao fluxo, ela pode ser descendente, ascendente, lateral ou diagonal. Descendente vai da chefia para os subordinados. Ascendente vai dos subordinados para a chefia. Lateral acontece entre colegas de mesmo nível. Diagonal cruza níveis e áreas diferentes.",
        "Quanto ao canal, ela pode ser formal ou informal. Formal usa os canais oficiais da empresa. Informal é o que se chama de rádio corredor.",
        "Quanto ao meio, ela pode ser escrita, oral, visual ou digital.",
        "Existem várias barreiras à comunicação. Barreiras físicas, como ruído e distância. Barreiras fisiológicas, como problemas de audição ou visão. Barreiras psicológicas, como preconceito, medo e desconfiança. Barreiras semânticas, como uso de palavras ambíguas. E barreiras culturais, como diferenças de valores e costumes.",
        "A comunicação eficaz exige algumas coisas. Clareza na mensagem. Escolha do canal adequado. Escuta ativa. Retorno da outra parte. E cuidado com o contexto.",
        "Guarde isto: comunicação organizacional tem fluxos, canais e barreiras. Comunicar bem não é só falar. É garantir que a mensagem chegou e foi compreendida."
      ].join("\n\n") },
      { titulo:"Bloco 24", heading:"Employer branding e atração de talentos", texto:[
        "Employer branding é a construção da imagem da empresa como um bom lugar para trabalhar.",
        "A ideia central é esta. Assim como uma empresa cuida da marca dos seus produtos, ela precisa cuidar da marca como empregadora. Porque isso afeta a capacidade de atrair e reter talentos.",
        "Uma boa marca de empregador tem alguns elementos. Proposta de valor clara. Cultura coerente com o que se diz. Oportunidades reais de desenvolvimento. Ambiente respeitoso. E reconhecimento.",
        "Existem várias formas de construir essa marca. Divulgar a cultura nas redes sociais. Participar de rankings de melhores empresas para trabalhar. Investir na experiência do candidato. Investir na experiência do empregado. E manter coerência entre o discurso e a prática.",
        "Um ponto crítico é a coerência. Não adianta divulgar uma cultura que não existe. Isso gera frustração, rotatividade e má reputação.",
        "Existe também o chamado marketing de recrutamento, que é o uso de estratégias de marketing para atrair candidatos. Ele trabalha a comunicação com o público-alvo certo, no canal certo, com a mensagem certa.",
        "Guarde isto: employer branding é a marca da empresa como empregadora. Afeta atração e retenção. E exige coerência entre o que se diz e o que se faz."
      ].join("\n\n") },
      { titulo:"Bloco 25", heading:"Indicadores de RH", texto:[
        "Indicadores de recursos humanos são números que medem o desempenho das práticas de pessoas na organização.",
        "Eles servem para várias coisas. Mostrar tendências. Comparar períodos. Identificar problemas. Justificar decisões. E orientar o planejamento.",
        "Existem indicadores de várias áreas.",
        "Na área de rotatividade, o indicador mais comum é a taxa de turnover. Ela mede a proporção de entradas e saídas em um período.",
        "Na área de absenteísmo, o indicador é a taxa de ausência. Ela mede as horas perdidas em relação às horas previstas.",

      { titulo:"Bloco 7", heading:"Adicional de insalubridade", texto:[

      { titulo:"Bloco 10", heading:"Aviso-prévio e rescisão", texto:[

        "A rescisão é o encerramento do contrato de trabalho. Ela pode ocorrer por vários motivos. Pedido de demissão, dispensa sem justa causa, dispensa por justa causa, fim de contrato por prazo determinado, aposentadoria e outros.",

      { titulo:"Bloco 11", heading:"FGTS e PIS/PASEP", texto:[

        "O PIS e o PASEP são programas de integração social. O PIS é para trabalhadores da iniciativa privada. O PASEP é para servidores públicos. Os dois são administrados pela Caixa e pelo Banco do Brasil, respectivamente.",

      { titulo:"Bloco 12", heading:"Contribuições previdenciárias", texto:[

      { titulo:"Bloco 13", heading:"Licenças e afastamentos", texto:[

        "O primeiro é o afastamento por doença. Quando o empregado adoece, ele pode se afastar. Nos primeiros quinze dias, o salário é pago pela empresa. A partir do décimo sexto dia, o afastamento passa a ser pago pelo INSS, como auxílio-doença, desde que o empregado tenha direito ao benefício.",

        "O quinto é a licença para serviço militar. O empregado que é convocado para o serviço militar tem direito a se afastar. Ao retornar, tem direito ao mesmo cargo, com todas as vantagens que teria se tivesse trabalhado.",

/* =====================
   LÓGICA — FILA CONTÍNUA ESTILO YOUTUBE
   ===================== */
const STORAGE_KEY = 'estudo_102_fila_v1';
let ouvidos = {};
let tocandoChave = null;
let synth = window.speechSynthesis;
let listaBlocos = [];
let filtroAtivo = false;
let rateAtual = 1.0;
let pausado = false;

const materiasEl = document.getElementById('materias');
const miniPlayer = document.getElementById('miniPlayer');
const miniTitle = document.getElementById('miniTitle');
const miniRate = document.getElementById('miniRate');
const btnPlayPause = document.getElementById('btnPlayPause');
const progressCount = document.getElementById('progressCount');
const progressFill = document.getElementById('progressFill');
const btnFiltro = document.getElementById('btnFiltro');
const btnPrimeiro = document.getElementById('btnPrimeiro');
const toastEl = document.getElementById('toast');
const modalRetomar = document.getElementById('modalRetomar');
const modalTexto = document.getElementById('modalTexto');

/* ---------- Persistência ---------- */
function salvar() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      ouvidos, filtroAtivo, rateAtual, ultimaChave: tocandoChave
    }));
  } catch (e) {}
}
function carregar() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const d = JSON.parse(raw);
    ouvidos = d.ouvidos || {};
    filtroAtivo = d.filtroAtivo || false;
    rateAtual = d.rateAtual || 1.0;
    return d.ultimaChave || null;
  } catch (e) { return null; }
}

/* ---------- Toast ---------- */
let toastTimer = null;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('visible');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('visible'), 2200);
}

/* ---------- Progresso ---------- */
function totalBlocos() { return MATERIAS.reduce((a, m) => a + m.blocos.length, 0); }
function contarOuvidos() { return Object.values(ouvidos).filter(Boolean).length; }
function atualizarProgresso() {
  const total = totalBlocos();
  const feitos = contarOuvidos();
  progressCount.textContent = `${feitos}/${total}`;
  progressFill.style.width = (total ? (feitos / total) * 100 : 0) + '%';
}

/* ---------- Render ---------- */
function render() {
  materiasEl.innerHTML = '';
  listaBlocos = [];
  MATERIAS.forEach((m, mi) => {
    const sec = document.createElement('div');
    sec.className = 'materia';
    sec.id = 'materia-' + mi;
    sec.innerHTML = `<h2>${m.icone} ${m.nome} <span class="badge">${m.blocos.length}</span></h2>`;
    materiasEl.appendChild(sec);

    m.blocos.forEach((b, bi) => {
      const chave = mi + '-' + bi;
      listaBlocos.push(chave);
      const div = document.createElement('div');
      div.className = 'bloco' + (ouvidos[chave] ? ' ouvido' : '');
      div.id = 'bloco-' + chave;
      div.innerHTML = `
        <div class="titulo">${b.titulo}${ouvidos[chave] ? ' • ouvido' : ''}</div>
        <h3>${b.heading}</h3>
        <div class="texto">${b.texto.split("\n\n").map(p => `<p>${p}</p>`).join('')}</div>
        <div class="actions">
          <button class="btn-ouvir" data-chave="${chave}">🔊 Ouvir</button>
          <button class="btn-fila" data-chave="${chave}" title="Tocar a partir daqui">▶ Fila</button>
        </div>
      `;
      sec.appendChild(div);
    });
  });

  document.querySelectorAll('.btn-ouvir').forEach(b => {
    b.addEventListener('click', () => {
      const chave = b.dataset.chave;
      if (tocandoChave === chave && !pausado) parar();
      else tocarPorChave(chave);
    });
  });
  document.querySelectorAll('.btn-fila').forEach(b => {
    b.addEventListener('click', () => tocarPorChave(b.dataset.chave));
  });

  aplicarFiltro();
  atualizarProgresso();
}

function aplicarFiltro() {
  document.querySelectorAll('.bloco').forEach(el => {
    const chave = el.id.replace('bloco-', '');
    el.classList.toggle('hidden', filtroAtivo && ouvidos[chave]);
  });
  document.querySelectorAll('.materia').forEach(sec => {
    const visiveis = sec.querySelectorAll('.bloco:not(.hidden)').length;
    sec.classList.toggle('hidden', visiveis === 0);
  });
  btnFiltro.classList.toggle('active', filtroAtivo);
}

/* ---------- Player ---------- */
function parar(limparFila) {
  synth.cancel();
  pausado = false;
  if (tocandoChave) {
    const el = document.getElementById('bloco-' + tocandoChave);
    if (el) {
      el.classList.remove('tocando');
      const btn = el.querySelector('.btn-ouvir');
      if (btn) btn.textContent = '🔊 Ouvir';
    }
  }
  tocandoChave = null;
  if (limparFila !== false) miniPlayer.classList.remove('visible');
  btnPlayPause.textContent = '⏸';
  salvar();
}

function pausar() {
  if (synth.speaking && !synth.paused) {
    synth.pause();
    pausado = true;
    btnPlayPause.textContent = '▶';
  }
}

function retomar() {
  if (synth.paused) {
    synth.resume();
    pausado = false;
    btnPlayPause.textContent = '⏸';
  }
}

function tocarPorChave(chave) {
  parar(false);
  const [mi, bi] = chave.split('-').map(Number);
  const b = MATERIAS[mi].blocos[bi];
  tocandoChave = chave;

  const el = document.getElementById('bloco-' + chave);
  if (el) {
    el.classList.add('tocando');
    const btn = el.querySelector('.btn-ouvir');
    if (btn) btn.textContent = '⏹ Parar';
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  miniTitle.textContent = `${b.titulo} — ${b.heading}`;
  miniRate.textContent = rateAtual.toFixed(1) + '×';
  miniPlayer.classList.add('visible');
  btnPlayPause.textContent = '⏸';
  pausado = false;

  const paragrafos = b.texto.split("\n\n").filter(p => p.trim().length > 0);
  let idxP = 0;

  function falarProximo() {
    if (!tocandoChave || tocandoChave !== chave) return;
    if (idxP >= paragrafos.length) {
      // bloco terminou
      ouvidos[chave] = true;
      salvar();
      atualizarProgresso();
      const elAtual = document.getElementById('bloco-' + chave);
      if (elAtual) {
        elAtual.classList.remove('tocando');
        elAtual.classList.add('ouvido');
        const titulo = elAtual.querySelector('.titulo');
        if (titulo) titulo.textContent = b.titulo + ' • ouvido';
        const btnAtual = elAtual.querySelector('.btn-ouvir');
        if (btnAtual) btnAtual.textContent = '🔊 Ouvir';
      }
      if (filtroAtivo) aplicarFiltro();
      // AUTOPLAY: emenda no próximo
      const proximo = proximaChave(chave);
      if (proximo) {
        setTimeout(() => tocarPorChave(proximo), 400);
      } else {
        parar();
        toast('Fim da fila 🎉');
      }
      return;
    }
    const u = new SpeechSynthesisUtterance(paragrafos[idxP]);
    u.lang = 'pt-BR';
    u.rate = rateAtual;
    u.pitch = 1;
    u.onend = () => { idxP++; falarProximo(); };
    u.onerror = () => { idxP++; falarProximo(); };
    synth.speak(u);
  }

  falarProximo();
}

function proximaChave(chave) {
  const idx = listaBlocos.indexOf(chave);
  if (idx < 0 || idx >= listaBlocos.length - 1) return null;
  if (filtroAtivo) {
    for (let i = idx + 1; i < listaBlocos.length; i++) {
      if (!ouvidos[listaBlocos[i]]) return listaBlocos[i];
    }
    return null;
  }
  return listaBlocos[idx + 1];
}
function chaveAnterior(chave) {
  const idx = listaBlocos.indexOf(chave);
  if (idx <= 0) return null;
  return listaBlocos[idx - 1];
}

/* ---------- Mini-player ---------- */
btnPlayPause.addEventListener('click', () => {
  if (!tocandoChave) return;
  if (synth.speaking && !synth.paused) pausar();
  else if (synth.paused) retomar();
});
document.getElementById('btnNext').addEventListener('click', () => {
  if (!tocandoChave) {
    const primeiro = listaBlocos.find(c => !ouvidos[c]) || listaBlocos[0];
    tocarPorChave(primeiro);
    return;
  }
  const prox = proximaChave(tocandoChave);
  if (prox) tocarPorChave(prox);
  else toast('Fim da fila');
});
document.getElementById('btnPrev').addEventListener('click', () => {
  if (!tocandoChave) return;
  const ant = chaveAnterior(tocandoChave);
  if (ant) tocarPorChave(ant);
  else toast('Início da fila');
});
document.getElementById('btnStop').addEventListener('click', () => parar());

miniRate.addEventListener('click', () => {
  const rates = [0.75, 1.0, 1.25, 1.5, 1.75, 2.0];
  const idx = rates.indexOf(rateAtual);
  rateAtual = rates[(idx + 1) % rates.length];
  miniRate.textContent = rateAtual.toFixed(1) + '×';
  toast('Velocidade: ' + rateAtual.toFixed(1) + '×');
  salvar();
  if (tocandoChave) {
    const chave = tocandoChave;
    const [mi, bi] = chave.split('-').map(Number);
    const b = MATERIAS[mi].blocos[bi];
    const paragrafos = b.texto.split("\n\n").filter(p => p.trim().length > 0);
    const u = new SpeechSynthesisUtterance(paragrafos.join(' '));
    u.lang = 'pt-BR';
    u.rate = rateAtual;
    u.onend = () => {
      ouvidos[chave] = true;
      salvar();
      atualizarProgresso();
      const prox = proximaChave(chave);
      if (prox) tocarPorChave(prox);
      else parar();
    };
    synth.cancel();
    synth.speak(u);
    btnPlayPause.textContent = '⏸';
    pausado = false;
  }
});

/* ---------- Filtro / começar ---------- */
btnFiltro.addEventListener('click', () => {
  filtroAtivo = !filtroAtivo;
  aplicarFiltro();
  salvar();
});
btnPrimeiro.addEventListener('click', () => {
  const primeiro = listaBlocos.find(c => !ouvidos[c]) || listaBlocos[0];
  tocarPorChave(primeiro);
});

/* ---------- Retomar ---------- */
document.getElementById('btnContinuar').addEventListener('click', () => {
  modalRetomar.classList.remove('visible');
  const ultima = localStorage.getItem(STORAGE_KEY + '_ultima');
  if (ultima && listaBlocos.includes(ultima)) tocarPorChave(ultima);
});
document.getElementById('btnRecomecar').addEventListener('click', () => {
  modalRetomar.classList.remove('visible');
  tocarPorChave(listaBlocos[0]);
});

/* ---------- Init ---------- */
function init() {
  carregar();
  btnFiltro.classList.toggle('active', filtroAtivo);
  render();

  setInterval(() => {
    if (tocandoChave) {
      try { localStorage.setItem(STORAGE_KEY + '_ultima', tocandoChave); } catch(e){}
    }
  }, 2000);

  const ultima = localStorage.getItem(STORAGE_KEY + '_ultima');
  if (ultima && listaBlocos.includes(ultima)) {
    const [mi, bi] = ultima.split('-').map(Number);
    const b = MATERIAS[mi] && MATERIAS[mi].blocos[bi];
    if (b) {
      modalTexto.textContent = `Você parou em "${b.titulo} — ${b.heading}". Deseja continuar?`;
      setTimeout(() => modalRetomar.classList.add('visible'), 500);
    }
  } else {
    setTimeout(() => toast('Toque em ▶ Ouvir para começar a fila'), 1000);
  }
}

/* =====================================================
   API GLOBAL — para o Apple Watch chamar via URL scheme
   Ex.: atalho do Watch abre:
   audio.html?cmd=next
   audio.html?cmd=prev
   audio.html?cmd=play
   audio.html?cmd=pause
   audio.html?cmd=stop
   ===================================================== */
window.playerPlay = function(chave) {
  if (chave) tocarPorChave(chave);
  else if (tocandoChave) retomar();
  else {
    const primeiro = listaBlocos.find(c => !ouvidos[c]) || listaBlocos[0];
    tocarPorChave(primeiro);
  }
};
window.playerPause = function() { pausar(); };
window.playerStop = function() { parar(); };
window.playerNext = function() {
  if (!tocandoChave) {
    const primeiro = listaBlocos.find(c => !ouvidos[c]) || listaBlocos[0];
    tocarPorChave(primeiro);
    return;
  }
  const prox = proximaChave(tocandoChave);
  if (prox) tocarPorChave(prox);
  else toast('Fim da fila');
};
window.playerPrev = function() {
  if (!tocandoChave) return;
  const ant = chaveAnterior(tocandoChave);
  if (ant) tocarPorChave(ant);
};
window.playerSetRate = function(r) {
  rateAtual = r;
  miniRate.textContent = r.toFixed(1) + '×';
  salvar();
};
window.playerState = function() {
  const [mi, bi] = (tocandoChave || '0-0').split('-').map(Number);
  const b = MATERIAS[mi] && MATERIAS[mi].blocos[bi];
  return {
    tocando: tocandoChave,
    titulo: b ? `${b.titulo} — ${b.heading}` : null,
    pausado,
    rate: rateAtual,
    ouvidos: contarOuvidos(),
    total: totalBlocos()
  };
};

/* ---------- Detecta comando via URL (vindo do atalho do Watch) ---------- */
(function handleURLCommand() {
  const params = new URLSearchParams(location.search);
  const cmd = params.get('cmd');
  if (!cmd) return;
  setTimeout(() => {
    switch (cmd) {
      case 'play':  window.playerPlay();  break;
      case 'pause': window.playerPause(); break;
      case 'next':  window.playerNext();  break;
      case 'prev':  window.playerPrev();  break;
      case 'stop':  window.playerStop();  break;
    }
  }, 800); // aguarda init
})();

/* ---------- Detecta iOS ---------- */
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

init();
</script>
